# «Простыми словами»: одна понятная фраза к каждому термину (показывается первой).
asr: "Программа слушает речь и превращает её в текст — как голосовой ввод в телефоне."
whisper: "Готовая нейросеть от OpenAI, которая переводит речь в текст на многих языках, в том числе на русском."
encoder-decoder: "Нейросеть из двух частей — одна «слушает» и понимает звук, вторая по этому пониманию пишет текст слово за словом."
transformer: "Самый распространённый сейчас тип нейросети; на нём построены и ChatGPT, и Whisper."
log-mel: "Картинка звука — какие частоты и насколько громко звучат в каждый момент; именно её «видит» Whisper вместо самих звуковых волн."
token: "Кусочек текста (слово или часть слова), который нейросеть выдаёт за один шаг."
greedy-decoding: "На каждом шаге нейросеть берёт самое вероятное слово и не перебирает варианты — быстро и просто."
beam-search: "Нейросеть держит в голове несколько вариантов фразы сразу и выбирает лучший — чуть точнее, но медленнее."
wer: "Процент слов, которые распознаны неправильно: 10 % значит, что ошибка в каждом десятом слове."
text-normalization: "Перед сравнением текст приводят к одному виду (без запятых, «ё» как «е», цифры словами), чтобы не считать ошибкой «5» вместо «пять»."
speech-fragment: "Одна фраза или команда, которую распознают целиком, — например, «включи музыку»."
vad: "Алгоритм, который понимает, где человек говорит, а где тишина, и режет поток с микрофона на фразы."
golos: "Большой открытый набор записей русской речи с правильными текстами — на нём проверяют распознавание."
inference: "Использование уже обученной нейросети: дали звук — получили текст."
quantization: "Сжатие нейросети: числа хранятся грубее, поэтому она становится меньше и быстрее почти без потери качества."
int8: "Числа внутри нейросети хранятся в 8 битах вместо 32 — в 4 раза меньше памяти."
onnx: "Универсальный формат файла нейросети, который понимают разные программы — как PDF для документов."
onnx-runtime-web: "Движок, который запускает нейросети прямо в браузере."
transformers-js: "Библиотека, с которой Whisper можно запустить в браузере парой строк кода."
ctranslate2: "Быстрый движок для запуска нейросетей на сервере."
faster-whisper: "Ускоренная версия Whisper для сервера — тот же результат, но в несколько раз быстрее."
cold-start: "Первый запуск нейросети медленный: её надо скачать и загрузить в память. Дальше она работает быстрее."
warmup: "Пробные запуски перед замерами, чтобы мерить «разогретую» систему, а не первый медленный старт."
browser-extension: "Маленькая программа, встроенная в браузер, — как блокировщик рекламы. В ВКР это расширение для голосового ввода."
manifest-v3: "Текущие правила Chrome о том, как устроены расширения и что им разрешено."
extension-service-worker: "Фоновая часть расширения; браузер её усыпляет, когда она не нужна."
offscreen-document: "Невидимая страница расширения, где можно записывать звук и запускать нейросеть."
web-worker: "Отдельный поток в браузере: тяжёлая работа идёт в нём, и страница не зависает."
webassembly: "Способ запускать в браузере быстрый код почти со скоростью обычной программы. Работает на процессоре."
webgpu: "Доступ браузера к видеокарте — нейросеть на ней считает в разы быстрее, но работает не везде."
web-audio: "Инструменты браузера для работы со звуком: записать, обрезать, перевести в нужный формат."
media-capture: "Разрешение «дать доступ к микрофону?» и сам поток звука с микрофона."
cors: "Правило безопасности: сайт может обращаться к чужому серверу, только если тот разрешил."
headless-browser: "Браузер без окна, которым управляет программа, — удобно для автоматических тестов."
playwright: "Инструмент, который сам открывает браузер, кликает и собирает данные — робот-тестировщик."
cdp: "«Пульт управления» браузером Chrome для программ: открыть страницу, замедлить сеть, собрать метрики."
edge-computing: "Считать прямо на устройстве пользователя или рядом с ним, а не в далёком облаке."
offloading: "Отдать тяжёлую задачу с телефона или ноутбука на сервер, если так быстрее."
collaborative-inference: "Нейросеть работает частично на устройстве, частично на сервере."
dnn-partitioning: "Нейросеть «разрезают»: начало считает телефон, конец — сервер."
early-exit: "Если нейросеть уже уверена в ответе, она заканчивает раньше и не считает до конца."
request-level-split: "Каждую фразу целиком распознаём либо в браузере, либо на сервере — без разрезания нейросети. Это подход ВКР."
local-inference: "Распознавание прямо в браузере: звук никуда не уходит и работает без интернета, но на слабом ноутбуке медленно."
server-inference: "Звук отправляется на сервер, там распознаётся, текст приходит обратно. Быстро, если хорошая сеть."
scheduler: "«Диспетчер» в расширении: для каждой фразы решает, распознавать её у себя или на сервере."
strategy: "Правило, по которому диспетчер решает: всегда у себя (S1), всегда на сервере (S2), по скорости сети (S3) или с умом (S4)."
static-rule: "Простое правило S3: сеть быстрая — отправляем на сервер, медленная — распознаём сами."
adaptive-strategy: "Умное правило S4: прикидывает, где получится быстрее с учётом сети, мощности и очереди, и при зависании сервера переключается на локальное."
latency-prediction: "Оценка «сколько секунд займёт» для каждого варианта до того, как его выбрать."
fallback: "Сервер не ответил вовремя или нет интернета — распознаём сами, чтобы пользователь не остался без текста."
queueing: "Фразы, ждущие своей очереди на распознавание. Если устройство медленнее речи, очередь растёт и ответ запаздывает."
ewma: "Способ усреднять измерения так, чтобы свежие значили больше старых, — быстро замечает, что сеть «просела»."
privacy: "Голос — личные данные. Чем реже он покидает устройство, тем лучше."
latency: "Сколько ждать результата. В ВКР — от конца фразы до появления текста."
rtt: "Сколько времени идёт «вопрос–ответ» до сервера и обратно (то, что показывает ping)."
throughput: "Скорость интернета — сколько данных проходит за секунду."
jitter: "Насколько «скачет» задержка: то 50 мс, то 200 мс."
packet-loss: "Часть данных теряется по дороге, их приходится отправлять повторно — всё тормозит."
netem: "Инструмент Linux, который искусственно делает интернет медленным, «прыгающим» или с потерями — чтобы проверять поведение в плохой сети."
network-profile: "Заранее заданный тип сети для экспериментов: хорошая, мобильная, плохая, нестабильная или без сети."
network-probe: "Маленький пробный запрос к серверу, чтобы узнать, какая сейчас сеть."
http: "Обычный способ общения браузера с сервером: отправил запрос — получил ответ."
websocket: "Постоянное соединение с сервером, по которому данные идут в обе стороны без новых запросов."
test-stand: "Лаборатория в коде: всё, что нужно, чтобы запускать эксперименты одинаково и получать честные цифры."
sut: "То, что мы проверяем, — здесь сам диспетчер и распознавание."
factor: "То, что мы меняем в эксперименте (стратегия, сеть, устройство), и его варианты."
full-factorial: "Проверяем все сочетания: каждую стратегию на каждой сети и каждом устройстве — 48 вариантов."
experiment-run: "Один запуск эксперимента: 16 фраз в реальном времени с одной настройкой."
randomization: "Запуски идут в случайном порядке, чтобы нагрев ноутбука или фоновые программы не исказили итог."
percentile: "p95 — «почти худший случай»: 95 % фраз распознались быстрее этого времени."
tail-latency: "Редкие, но очень долгие ожидания — именно их пользователь и запоминает."
bootstrap: "Способ оценить разброс результата, многократно перемешивая свои же данные."
mann-whitney: "Статистический тест: правда ли одна группа быстрее другой или это случайность."
cliffs-delta: "Насколько сильна разница: от «почти никакой» до «большой», числом от −1 до 1."
holm: "Поправка, когда проверяешь много гипотез сразу, чтобы не найти «эффект» случайно."
aa-test: "Сравниваем систему саму с собой. Если «нашлась разница» — значит, стенд шумит."
mde: "Самая маленькая разница, которую эксперимент вообще способен заметить."
validity-threats: "Причины, по которым вывод может быть неверным, и что сделано, чтобы их избежать."
repeatability: "Я сам перезапустил эксперимент — получил то же самое."
reproducibility: "Другой человек запустил мой код — получил то же самое."
replicability: "Другой человек написал всё сам по моему описанию — и вывод совпал."
artifact: "Код, данные и инструкции, выложенные вместе с работой, чтобы её можно было проверить."
run-manifest: "«Паспорт» каждого запуска: когда, на каком железе, с какими версиями и настройками."
container: "Программа вместе со всем, что ей нужно, в отдельной «коробке»: запускается одинаково на любом компьютере."
container-image: "Шаблон «коробки», из которого запускают контейнеры, — как установочный файл."
oci: "Общий стандарт контейнеров, благодаря которому они работают не только в Docker."
dockerfile: "Рецепт сборки контейнера: что установить и что запустить."
docker-compose: "Один файл, который запускает сразу несколько контейнеров вместе."
image-digest: "Уникальный «отпечаток» версии образа: он гарантирует, что это ровно та же сборка."
lock-file: "Список точных версий всех библиотек, чтобы через год собралось то же самое."
cgroups: "Механизм Linux, ограничивающий программе процессор и память. Так мы и делаем «слабый ноутбук»."
container-registry: "«Магазин» образов контейнеров, откуда их скачивают для запуска."
prometheus: "Система, которая постоянно собирает показатели сервера: нагрузку, время ответа."
ci: "Робот, который при каждом изменении кода сам всё собирает и проверяет."
rtf: "Во сколько раз распознавание дольше самой речи: меньше 1 — успевает за тобой, больше 1 — отстаёт."
device-profile: "Заданная «мощность ноутбука» в эксперименте: целое ядро, половина или четверть."
hypothesis: "H₀ — «эффекта нет», H₁ — «эффект есть»; эксперимент решает, какую принять."
blocking: "Сравниваем стратегии на одной и той же машине, чтобы разница в железе не путалась с разницей стратегий."
censoring: "Если текст так и не пришёл, считаем ожидание максимальным (30 с), а не выкидываем фразу из подсчёта."
opus: "Сжатие голоса примерно в 10 раз — та же фраза улетает на сервер намного быстрее."
hedged-requests: "Если ответ задерживается — запускаем то же самое ещё раз в другом месте и берём, что придёт первым."
wasm-threads: "Распознавание в браузере сразу на нескольких ядрах процессора — быстрее на нормальных ноутбуках."

# План ВКР и привязка терминов к параграфам.
# Правило: термин остаётся в глоссарии, только если у него есть место в тексте ВКР (проверяется тестом).
outline:
  - id: "intro"
    title: "Введение"
    about: "Зачем голосовому вводу в браузере выбирать, где распознавать речь; цель, задачи, гипотезы, новизна"
  - id: "1"
    title: "1 Распознавание речи в браузере и на сервере: обзор"
    sections:
      - {id: "1.1", title: "Распознавание речи и модели Whisper", about: "Как устроено распознавание, что такое Whisper и как мерить качество"}
      - {id: "1.2", title: "Нейросети в браузере", about: "Чем браузер может исполнять модель: WebAssembly, WebGPU, ONNX Runtime Web; цена холодного старта"}
      - {id: "1.3", title: "Распределение вычислений между устройством и сервером", about: "Neurosurgeon, SPINN и др.: что уже предложено и чего не хватает для речи в браузере"}
      - {id: "1.4", title: "Постановка задачи", about: "Фрагменты речи в реальном времени, место выполнения, критерий — задержка и качество"}
  - id: "2"
    title: "2 Метод адаптивного распределения фрагментов речи"
    sections:
      - {id: "2.1", title: "Модель задержки", about: "Из чего складывается время до текста локально и на сервере; очередь; реальное время"}
      - {id: "2.2", title: "Оценка состояния сети и устройства", about: "Зонды, сглаживание, оценка канала и скорости модели"}
      - {id: "2.3", title: "Стратегии S1–S4 и откат на локальное", about: "Правила выбора, срок ответа сервера, работа без сети, приватность"}
      - {id: "2.4", title: "Архитектура расширения", about: "Manifest V3, offscreen document, воркер, захват звука, обмен с сервером"}
  - id: "3"
    title: "3 Экспериментальный стенд и методика"
    sections:
      - {id: "3.1", title: "Стенд", about: "Контейнеры, сервер и клиент, эмуляция сети и устройства, мониторинг"}
      - {id: "3.2", title: "План эксперимента и метрики", about: "Факторы и уровни, прогоны, рандомизация, блоки, p95, WER"}
      - {id: "3.3", title: "Статистический анализ", about: "Гипотезы, bootstrap, Манн–Уитни, δ Клиффа, Холм"}
      - {id: "3.4", title: "Воспроизводимость", about: "Образы, lock-файлы, манифест прогона, CI, артефакт по ACM"}
  - id: "4"
    title: "4 Результаты и обсуждение"
    sections:
      - {id: "4.1", title: "Проверка стенда", about: "A/A-тест, шум и минимальный обнаружимый эффект, стабильность"}
      - {id: "4.2", title: "Задержка и качество стратегий", about: "Проверка H₁ и H₂, хвосты задержки, WER"}
      - {id: "4.3", title: "Улучшения", about: "Сжатие звука, многопоточность, WebGPU, хеджирование запросов, потоковая передача"}
      - {id: "4.4", title: "Угрозы валидности и ограничения", about: "Что могло исказить вывод и как это учтено"}


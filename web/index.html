<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Глоссарий ВКР</title>
  <meta name="description" content="Термины ВКР о распознавании речи в браузере и на сервере: простыми словами, определения, связи, источники и план диплома">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <!-- левая панель: дерево тем и план ВКР -->
    <aside class="side left" id="left">
      <div class="side-head">
        <div class="vault"><span class="vault-dot"></span>Глоссарий ВКР</div>
        <button class="icon" id="open-search" title="Быстрый переход (⌘K)">⌕</button>
      </div>
      <div class="side-tabs">
        <button data-tree="files" class="on">Темы</button>
        <button data-tree="vkr">План ВКР</button>
      </div>
      <nav id="tree-files" class="tree"></nav>
      <nav id="tree-vkr" class="tree" hidden></nav>
      <div class="side-foot" id="stats"></div>
    </aside>

    <!-- центр: вкладки, граф и заметка -->
    <main class="center">
      <div class="tabbar">
        <button class="mobile-only icon" id="toggle-left" title="Темы">☰</button>
        <div class="tabs" id="tabs"></div>
        <button class="search-pill" id="search-pill"><span>Поиск термина</span><kbd>⌘K</kbd></button>
        <a class="icon" id="api-link" href="/docs" target="_blank" rel="noopener" title="Web API">{ }</a>
      </div>
      <section class="pane" id="graph-pane">
        <div id="cy"></div>
        <div class="graph-legend" id="legend"></div>
        <div class="graph-hint">колёсико — масштаб · наведите — связи · клик — открыть заметку</div>
      </section>
      <section class="pane note-pane" id="note-pane" hidden>
        <article class="note" id="note"></article>
      </section>
      <section class="pane note-pane" id="plan-pane" hidden>
        <article class="note" id="plan"></article>
      </section>
    </main>

    <!-- правая панель: локальный граф и ссылки -->
    <aside class="side right" id="right">
      <div class="panel-title">Локальный граф</div>
      <div id="local-cy"></div>
      <div class="panel-title">Обратные ссылки <span id="bl-count" class="count"></span></div>
      <div id="backlinks" class="links"></div>
      <div class="panel-title">Исходящие ссылки <span id="ol-count" class="count"></span></div>
      <div id="outlinks" class="links"></div>
    </aside>
  </div>

  <!-- быстрый переход -->
  <div class="modal" id="switcher" hidden>
    <div class="switcher">
      <input id="q" type="search" placeholder="Найти термин…" autocomplete="off" aria-label="Поиск термина">
      <ul id="results" role="listbox"></ul>
      <div class="switcher-foot"><kbd>↑↓</kbd> выбрать <kbd>↵</kbd> открыть <kbd>esc</kbd> закрыть</div>
    </div>
  </div>

  <script src="/static/vendor/cytoscape-3.34.1.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

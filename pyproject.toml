[project]
name = "vkr-glossary"
version = "1.1.0"
description = "Глоссарий ВКР: Web API, семантический граф терминов и фронтенд"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.32,<0.33",
  "pyyaml>=6.0",
  "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false

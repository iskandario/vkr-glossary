# Зеркало статической версии на GitHub Pages (доступно откуда угодно, в том числе через VPN)
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.13.6"}
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python scripts/export_static.py dist && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
      - id: d
        uses: actions/deploy-pages@v4
